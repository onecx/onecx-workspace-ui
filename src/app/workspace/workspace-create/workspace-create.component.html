@if (displayDialog) {
  <p-dialog
    [visible]="true"
    (visibleChange)="closeDialog()"
    [header]="'DIALOG.WORKSPACE.HEADER.CREATE' | translate"
    [modal]="true"
    [closable]="true"
    [draggable]="true"
    [resizable]="true"
    [dismissableMask]="true"
    [contentStyle]="{ overflow: 'auto' }"
    [style]="{ width: '700px' }"
    styleClass="disable-max-height-preset"
    [breakpoints]="{ '991px': '700px' }"
  >
    <ocx-slot [name]="slotName" [inputs]="{ dataType: 'themes' }" [outputs]="{ themes: themesEmitter }"> </ocx-slot>
    <form [formGroup]="formGroup">
      <div class="pt-1 flex flex-wrap flex-column gap-4 justify-content-between">
        <div class="flex flex-row flex-wrap gap-3 justify-content-between">
          <p-floatlabel variant="on" class="w-12 sm:w-5x">
            <input
              pInputText
              type="text"
              id="ws_create_form_name"
              class="w-full pt-3 pb-2"
              formControlName="name"
              [attr.aria-label]="'WORKSPACE.NAME' | translate"
              [pTooltip]="'WORKSPACE.TOOLTIPS.NAME' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <label class="ocx-required-label" for="ws_create_form_name" aria-hidden="true">
              {{ 'WORKSPACE.NAME' | translate }}
            </label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="w-12 sm:w-7x">
            <input
              pInputText
              type="text"
              id="ws_create_form_display_name"
              class="w-full pt-3 pb-2"
              formControlName="displayName"
              [attr.aria-label]="'WORKSPACE.DISPLAY_NAME' | translate"
              [pTooltip]="'WORKSPACE.TOOLTIPS.DISPLAY_NAME' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <label class="ocx-required-label" for="ws_create_form_display_name" aria-hidden="true">
              {{ 'WORKSPACE.DISPLAY_NAME' | translate }}
            </label>
          </p-floatlabel>
        </div>

        <div class="w-12">
          <div class="flex flex-row flex-wrap gap-3 justify-content-between">
            @let themes = (themes$ | async) ?? [currentTheme$ | async];
            @if (themes) {
              <p-floatlabel variant="on" class="w-12 sm:w-5x">
                <p-select
                  id="ws_create_form_theme"
                  formControlName="theme"
                  styleClass="w-full input-field-correction"
                  optionLabel="displayName"
                  optionValue="name"
                  [options]="themes"
                  [showClear]="true"
                  [ariaLabel]="'WORKSPACE.THEME' | translate"
                  [pTooltip]="'WORKSPACE.TOOLTIPS.THEME' | translate"
                  tooltipPosition="top"
                  tooltipEvent="hover"
                >
                </p-select>
                <label class="ocx-required-label" for="ws_create_form_theme" aria-hidden="true">
                  {{ 'WORKSPACE.THEME' | translate }}
                </label>
              </p-floatlabel>
            }
            @let paths = (productPaths$ | async) ?? [];
            @if (paths) {
              <p-floatlabel variant="on" class="w-12 sm:w-7x">
                <p-select
                  id="ws_create_form_home_page"
                  formControlName="homePage"
                  styleClass="w-full input-field-correction"
                  (onClick)="onOpenProductPathes(paths)"
                  [options]="paths"
                  [showClear]="true"
                  [escape]="false"
                  [ariaLabel]="'WORKSPACE.HOME_PAGE' | translate"
                  [ariaLabel]="('WORKSPACE.HOME_PAGE' | translate) + ('VALIDATION.HINTS.FORMAT_HOME_PAGE' | translate)"
                  [pTooltip]="('WORKSPACE.HOME_PAGE' | translate) + ('VALIDATION.HINTS.FORMAT_HOME_PAGE' | translate)"
                  tooltipPosition="top"
                  tooltipEvent="hover"
                >
                </p-select>
                <label for="ws_create_form_home_page" aria-hidden="true">
                  {{ 'WORKSPACE.HOME_PAGE' | translate }}
                </label>
              </p-floatlabel>
            }
          </div>
        </div>

        <div>
          <p-floatlabel variant="on">
            <input
              pInputText
              type="text"
              id="ws_create_form_baseUrl"
              class="w-full pt-3 pb-2"
              formControlName="baseUrl"
              [escape]="false"
              [ariaLabel]="
                ('WORKSPACE.TOOLTIPS.BASE_URL' | translate) + ('VALIDATION.HINTS.FORMAT_BASE_URL' | translate)
              "
              [pTooltip]="
                ('WORKSPACE.TOOLTIPS.BASE_URL' | translate) + ('VALIDATION.HINTS.FORMAT_BASE_URL' | translate)
              "
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <label class="ocx-required-label" for="ws_create_form_baseUrl" aria-hidden="true">
              {{ 'WORKSPACE.BASE_URL' | translate }}
            </label>
          </p-floatlabel>
        </div>

        <div class="flex flex-wrap sm:flex-nowrap align-items-center row-gap-2 column-gap-4">
          <app-image
            [id]="'ws_create_form_logo_image'"
            styleClass="max-h-3rem max-w-4rem"
            [item]="{
              refType: RefType.Logo,
              imageType: 'workspace',
              url: formGroup.controls['logoUrl'].value
            }"
          ></app-image>
          <p-floatlabel variant="on" class="w-full">
            <input
              pInputText
              type="text"
              id="ws_create_form_logo"
              class="w-full pt-3 pb-2"
              formControlName="logoUrl"
              [escape]="false"
              [ariaLabel]="('IMAGE.LOGO' | translate) + ':  ' + ('IMAGE.TOOLTIPS.URL' | translate)"
              [pTooltip]="('IMAGE.TOOLTIPS.URL' | translate) + ('VALIDATION.HINTS.FORMAT_IMAGE_URL' | translate)"
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <label for="ws_create_form_logo" aria-hidden="true">{{ 'IMAGE.LOGO_URL' | translate }} </label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="on">
            <input
              pInputText
              type="text"
              id="ws_create_form_footerLabel"
              class="w-full pt-3 pb-2"
              formControlName="footerLabel"
              [attr.aria-label]="'WORKSPACE.FOOTER_LABEL' | translate"
              [pTooltip]="'WORKSPACE.TOOLTIPS.FOOTER_LABEL' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            />
            <label for="ws_create_form_footerLabel" aria-hidden="true"
              >{{ 'WORKSPACE.FOOTER_LABEL' | translate }}
            </label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="on">
            <textarea
              class="w-full"
              pInputTextarea
              autoresize="true"
              rows="4"
              id="ws_create_form_description"
              formControlName="description"
              [attr.aria-label]="'WORKSPACE.DESCRIPTION' | translate"
              [pTooltip]="'WORKSPACE.TOOLTIPS.DESCRIPTION' | translate"
              tooltipPosition="top"
              tooltipEvent="hover"
            ></textarea>
            <label for="ws_create_form_description" aria-hidden="true"
              >{{ 'WORKSPACE.DESCRIPTION' | translate }}
            </label>
          </p-floatlabel>
        </div>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <div class="flex flex-wrap column-gap-2 row-gap-1 justify-content-end">
        <p-button
          id="ws_create_action_cancel"
          icon="pi pi-times"
          (onClick)="closeDialog()"
          [label]="'ACTIONS.CANCEL' | translate"
          [ariaLabel]="'ACTIONS.CANCEL' | translate"
          [pTooltip]="'ACTIONS.TOOLTIPS.CANCEL' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        ></p-button>
        <p-button
          id="ws_create_action_save"
          icon="pi pi-plus"
          [disabled]="!formGroup.valid"
          (onClick)="saveWorkspace()"
          [label]="'ACTIONS.CREATE.LABEL' | translate"
          [ariaLabel]="'ACTIONS.CREATE.LABEL' | translate"
          [pTooltip]="'ACTIONS.CREATE.WORKSPACE.TOOLTIP' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        ></p-button>
      </div>
    </ng-template>
  </p-dialog>
}
