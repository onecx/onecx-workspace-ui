@let img = item();
@let label = title();
@if (img) {
  <img
    [id]="id()"
    [class]="'max-w-full border-round-sm ' + (styleClass() ?? '')"
    [ocxSrc]="urlNext() ?? url()"
    (error)="onImageLoadError()"
    (load)="onImageLoadSuccess()"
    [alt]="label ?? 'Logo ' + img.imageType"
    [attr.aria-label]="label ?? 'Logo ' + img.imageType"
    [pTooltip]="label"
    tooltipPosition="top"
    tooltipEvent="hover"
    aria-hidden="true"
  />
}
