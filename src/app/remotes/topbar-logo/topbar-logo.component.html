<div #container class="ocx-topbar-logo-container">
  @if (remoteConfig) {
    <app-current-workspace-logo
      [imageId]="imageId"
      [imageUrl]="imageUrl"
      [imageStyleClass]="imageStyleClass"
      [imageType]="currentImageType()"
      [useDefaultLogo]="useDefaultLogo"
      [logPrefix]="logPrefix"
      [logEnabled]="logEnabled"
      [ocxRemoteComponentConfig]="remoteConfig"
    ></app-current-workspace-logo>
  }
</div>
