<!-- LOGO -->
<div class="current-workspace-logo-container">
  @let url = imageUrl$ | async;
  @if (url) {
    <img
      [id]="imageId ?? 'ws_logo_' + workspaceName"
      [class]="'border-round-sm ' + (imageStyleClass ?? '')"
      [ocxSrc]="url"
      (error)="onImageLoadError(url)"
      (load)="onImageLoadSuccess()"
      [alt]="'Logo Workspace ' + workspaceName"
      [attr.aria-label]="'Logo Workspace ' + workspaceName"
    />
  }
</div>
