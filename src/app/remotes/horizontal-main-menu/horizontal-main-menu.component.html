@let state = { isActive: isActive$ | async, isHidden: isHidden$ | async, menuItems: menuItems$ | async };
@if (state.isActive) {
  <p-menubar
    #menubar
    [hidden]="state.isHidden"
    breakpoint="767"
    [model]="state.menuItems ?? []"
    styleClass="layout-menubar-horizontal-main-menu fadeinup"
  ></p-menubar>
}
